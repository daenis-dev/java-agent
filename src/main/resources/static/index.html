<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engineering Agent</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e5e7eb;background:#0b1220}*{box-sizing:border-box}body{margin:0}header{padding:20px 24px;background:#111c2d;border-bottom:1px solid #334155}h1{font-size:20px;margin:0}small{color:#94a3b8}main{max-width:950px;margin:auto;padding:20px}#messages{height:56vh;overflow-y:auto;background:#101827;border:1px solid #334155;border-radius:12px;padding:16px;white-space:pre-wrap}.message{padding:12px;margin:10px 0;border-radius:8px;line-height:1.5}.user{background:#1d3550}.assistant{background:#1d2939}textarea,input{width:100%;background:#111c2d;color:white;border:1px solid #475569;border-radius:8px;padding:12px;font:inherit}textarea{min-height:90px}button{background:#2563eb;color:white;border:0;border-radius:8px;padding:11px 15px;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#334155}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}#status{margin:12px 0;color:#a5b4fc}
</style></head><body><header><h1>Engineering Agent</h1><small>Conversational Java Agent · Local MVP</small></header><main><div class="controls"><button class="secondary" id="new">New conversation</button><button class="secondary" id="load">Load conversation</button><input id="conversation" aria-label="Conversation ID" style="flex:1;min-width:160px"></div><div id="status"></div><div id="messages" aria-live="polite"></div><form id="form"><p><textarea id="message" placeholder="Discuss a design decision, challenge an architecture or ask about principles..." required></textarea></p><div class="controls"><button type="submit" id="send">Send</button><button type="button" class="secondary" id="interpret">Analyze interpretation</button><button type="button" class="secondary" id="save">Analyze and save agent interpretation</button></div></form></main>
<script>
const $=id=>document.getElementById(id);let busy=false;
const newId=()=>crypto.randomUUID();$('conversation').value=newId();
function add(role,content){const div=document.createElement('div');div.className='message '+role;div.textContent=(role==='user'?'You: ':'Agent: ')+content;$('messages').append(div);$('messages').scrollTop=$('messages').scrollHeight}
async function request(path,payload){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data}
async function send(mode){if(busy)return;const message=$('message').value.trim();if(!message)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);add('user',message);$('message').value='';try{let result;if(mode==='save'){const title=prompt('Interpretation title (letters, numbers, spaces and hyphens):');if(!title)return;result=await request('/api/knowledge/interpretations',{conversationId:$('conversation').value,title,question:message});add('assistant',result.content+'\n\nSaved to: '+result.path)}else{result=await request(mode==='interpret'?'/api/interpret':'/api/chat',{conversationId:$('conversation').value,message});add('assistant',result.answer)}}catch(e){add('assistant','Error: '+e.message)}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
$('form').onsubmit=e=>{e.preventDefault();send('chat')};$('interpret').onclick=()=>send('interpret');$('save').onclick=()=>send('save');$('new').onclick=()=>{$('conversation').value=newId();$('messages').replaceChildren()};$('load').onclick=async()=>{try{const r=await fetch('/api/conversations/'+encodeURIComponent($('conversation').value));if(!r.ok)throw Error('Cannot load');$('messages').replaceChildren();for(const m of await r.json())add(m.role,m.content)}catch(e){alert(e.message)}};
fetch('/api/knowledge/status').then(r=>r.json()).then(d=>$('status').textContent='Knowledge: '+d.status).catch(()=>{});
</script></body></html>
